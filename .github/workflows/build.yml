name: webrte Payload

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # None of these change webrte.bin, so building and cutting a release for
    # them only burns a version number. Use the Actions tab's "Run workflow"
    # button if you ever want a build from an unchanged tree anyway.
    paths-ignore:
      - '**.md'
      - 'dashboard/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
      - 'send.py'
      - 'send.sh'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'dashboard/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
      - 'send.py'
      - 'send.sh'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          submodules: recursive # Ensure submodules are checked out

      - name: Set execute permissions for scripts
        run: chmod +x build.sh

      - name: Build and package binaries
        run: ./build.sh

      - name: Release for branch main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create webrte-1.0${{ github.run_number }} webrte.bin --target ${{ github.sha }} -t webrte-1.0${{ github.run_number }}
